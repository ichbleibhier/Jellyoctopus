<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelly Octopus</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --water: #0F3A4A; --jelly: #B79CFF; --core: #6E4BD8; --suckers: #F1E6FF;
    --accent: #FF8FB8; --warm: #FFF0D6; --caustic: #BFF4FF;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--water); }
  body { font: 500 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--suckers); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; outline: none; }
  #title {
    position: fixed; top: 14px; left: 20px; margin: 0;
    font: 700 30px/1.1 "Baloo 2", system-ui, sans-serif; color: var(--suckers);
    letter-spacing: .2px; pointer-events: none; user-select: none;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .25);
  }
  #panel {
    position: fixed; left: 16px; top: 68px; width: 220px; box-sizing: border-box;
    padding: 14px 16px 16px; border-radius: 16px;
    background: rgba(15, 58, 74, .6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(241, 230, 255, .12); touch-action: manipulation;
  }
  .row { margin-bottom: 12px; }
  .row label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .row output { font-variant-numeric: tabular-nums; opacity: .8; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
  button {
    width: 100%; height: 34px; border: 0; border-radius: 10px; cursor: pointer;
    font: 600 14px system-ui, sans-serif; color: var(--water); background: var(--suckers);
  }
  button:hover { background: #fff; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #hint {
    position: fixed; bottom: 26px; left: calc(118px + 50%); transform: translateX(-50%);
    padding: 7px 14px; border-radius: 999px; background: rgba(15, 58, 74, .55);
    font-size: 14px; letter-spacing: .3px; white-space: nowrap; pointer-events: none;
    transition: opacity .9s ease;
  }
  #hint.gone { opacity: 0; }
  @media (max-width: 700px) {
    #title { font-size: 30px; top: 12px; left: 16px; }
    #panel { top: auto; bottom: 16px; left: 16px; padding: 10px 14px 12px; }
    .row { margin-bottom: 8px; }
    #hint { bottom: auto; top: 58px; left: 16px; transform: none; font-size: 12.5px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<h1 id="title">Jelly Octopus</h1>
<div id="panel">
  <div class="row">
    <label for="soft">Softness <output id="softOut">0.30</output></label>
    <input id="soft" type="range" min="0.1" max="1" step="0.01" value="0.3">
  </div>
  <div class="row">
    <label for="cur">Current <output id="curOut">0.30</output></label>
    <input id="cur" type="range" min="0" max="1" step="0.01" value="0.3">
  </div>
  <button id="reset" type="button">Reset</button>
</div>
<div id="hint">drag a tentacle · poke · tickle · toss</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- palette
const PAL = {
  jelly: 0xB79CFF, core: 0x6E4BD8, suckers: 0xF1E6FF, water: 0x0F3A4A,
  sand: 0xE9D9B8, accent: 0xFF8FB8, warm: 0xFFF0D6, caustic: 0xBFF4FF,
};
const col = (h) => new THREE.Color(h);

const mq = matchMedia('(prefers-reduced-motion: reduce)');
let reducedMotion = mq.matches;
mq.addEventListener('change', (e) => { reducedMotion = e.matches; });

// ---------------------------------------------------------------- world constants
const HOME = new THREE.Vector3(0, 0.15, 0);   // mantle centre; hero bbox centre ~ y 0
const SEABED = -0.35;                          // 0.35 m below the hero
const SUB = 1 / 120;                           // fixed PBD substep

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
if (!renderer.capabilities.isWebGL2) document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;top:40%;width:100%;text-align:center">WebGL2 required</p>');
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(PAL.water, 1);
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
canvas.tabIndex = 0;

// Halving the transmission pass: three r160 sizes its transmission target from
// getDrawingBufferSize(), which nothing else in the renderer calls.
const baseDBS = renderer.getDrawingBufferSize.bind(renderer);
let transmissionHalf = false;
renderer.getDrawingBufferSize = (t) => {
  baseDBS(t);
  if (transmissionHalf) t.set(Math.max(1, Math.floor(t.x / 2)), Math.max(1, Math.floor(t.y / 2)));
  return t;
};

const scene = new THREE.Scene();
scene.background = col(PAL.water);
scene.fog = new THREE.FogExp2(PAL.water, 0.35);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.03, 30);
const CAM_TARGET = new THREE.Vector3(0, 0, 0);
function placeCamera(dist) {
  const el = THREE.MathUtils.degToRad(-5);
  camera.position.set(0, Math.sin(el) * dist, Math.cos(el) * dist).add(CAM_TARGET);
  camera.lookAt(CAM_TARGET);
}

// ---------------------------------------------------------------- caustic cookie
const causticRT = new THREE.WebGLRenderTarget(512, 512, {
  type: THREE.HalfFloatType, wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping,
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false,
});
const causticMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uCaustic: { value: col(PAL.caustic) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform float uTime; uniform vec3 uCaustic; varying vec2 vUv;
    #define TAU 6.28318530718
    float caus(vec2 uv, float time){
      vec2 p = mod(uv * TAU, TAU) - 250.0;
      vec2 i = p; float c = 1.0; float inten = 0.005;
      for (int n = 0; n < 5; n++) {
        float t = time * (1.0 - (3.5 / float(n + 1)));
        i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
        c += 1.0 / length(vec2(p.x / (sin(i.x + t) / inten), p.y / (cos(i.y + t) / inten)));
      }
      c /= 5.0; c = 1.17 - pow(c, 1.4);
      return clamp(pow(abs(c), 8.0), 0.0, 1.0);
    }
    void main(){
      float t = uTime * 0.45 + 23.0;
      float v = caus(vUv * 5.0, t);
      v = max(v, 0.6 * caus(vUv * 5.0 + vec2(0.37, 0.21), t * 0.83 + 4.0));
      vec3 col = vec3(0.42) + uCaustic * v * 3.2;
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});
const causticScene = new THREE.Scene();
causticScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), causticMat));
const causticCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
let causticDrawn = false;
function renderCaustics(t) {
  if (reducedMotion && causticDrawn) return;
  causticMat.uniforms.uTime.value = reducedMotion ? 0 : t;
  const prevTM = renderer.toneMapping;
  renderer.setRenderTarget(causticRT);
  renderer.render(causticScene, causticCam);
  renderer.setRenderTarget(null);
  renderer.toneMapping = prevTM;
  causticDrawn = true;
}

// ---------------------------------------------------------------- lights (no ambient)
const key = new THREE.SpotLight(PAL.warm, 2.6, 0, 0.78, 0.6, 0);
key.position.set(0.35, 2.5, 0.45);
key.target.position.set(0, -0.2, -0.15);
key.map = causticRT.texture;
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1.2; key.shadow.camera.far = 4.5;
key.shadow.bias = -0.0006; key.shadow.normalBias = 0.01; key.shadow.radius = 5;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(PAL.caustic, 1.5);
rim.position.set(-0.5, 0.8, -1.6);
scene.add(rim);

// ---------------------------------------------------------------- seabed
const shadowU = { value: new THREE.Vector4(0, 0, 0.5, 0.17) };
function sandHeight(x, z) {
  return 0.0035 * Math.sin(x * 22 + 2.2 * Math.sin(z * 2.7)) + 0.0025 * Math.sin(z * 31 + x * 6)
    + 0.012 * Math.sin(x * 1.6 + z * 1.1) * Math.sin(z * 1.3 - 0.4);
}
{
  const g = new THREE.PlaneGeometry(26, 26, 220, 220);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, sandHeight(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const cx = cv.getContext('2d'); const img = cx.createImageData(256, 256);
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 256 * 256; i++) {
    const n = 0.86 + rnd() * 0.18;
    img.data[i * 4] = 233 * n; img.data[i * 4 + 1] = 217 * n; img.data[i * 4 + 2] = 184 * n; img.data[i * 4 + 3] = 255;
  }
  cx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(60, 60);
  tex.anisotropy = 4;
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: tex, roughness: 0.95, metalness: 0 });
  mat.onBeforeCompile = (s) => {
    s.uniforms.uShadow = shadowU;
    s.vertexShader = 'varying vec3 vWP;\n' + s.vertexShader.replace('#include <worldpos_vertex>',
      '#include <worldpos_vertex>\n vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    s.fragmentShader = 'uniform vec4 uShadow;\nvarying vec3 vWP;\n' + s.fragmentShader.replace('#include <color_fragment>',
      `#include <color_fragment>
       vec2 dd = (vWP.xz - uShadow.xy) * vec2(1.0, 1.25);
       float cs = exp(-dot(dd, dd) / (2.0 * uShadow.w * uShadow.w));
       float core = exp(-dot(dd, dd) / (2.0 * 0.25 * uShadow.w * uShadow.w));
       diffuseColor.rgb *= 1.0 - uShadow.z * (0.65 * cs + 0.35 * core);`);
  };
  const sand = new THREE.Mesh(g, mat);
  sand.position.y = SEABED; sand.receiveShadow = true;
  scene.add(sand);

  // two pebbles
  const mk = (sx, sy, sz, c, x, z, rot, ph) => {
    const pg = new THREE.IcosahedronGeometry(1, 4);
    const pp = pg.attributes.position; const v = new THREE.Vector3();
    for (let i = 0; i < pp.count; i++) {
      v.fromBufferAttribute(pp, i);
      const n = 1 + 0.07 * Math.sin(v.x * 3.1 + ph) * Math.sin(v.y * 2.7 + 1.3 * ph) + 0.05 * Math.sin(v.z * 4.3 - ph);
      const nn = v.clone().normalize();
      v.multiplyScalar(n); pp.setXYZ(i, v.x, v.y, v.z);
      pg.attributes.normal.setXYZ(i, nn.x, nn.y, nn.z);
    }
    const m = new THREE.Mesh(pg, new THREE.MeshStandardMaterial({ color: c, roughness: 0.78 }));
    m.scale.set(sx, sy, sz); m.rotation.y = rot;
    m.position.set(x, SEABED + sandHeight(x, z) + sy * 0.55, z);
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
  };
  mk(0.075, 0.042, 0.058, 0xA89A86, -0.33, -0.12, 0.6, 1.0);
  mk(0.045, 0.03, 0.04, 0xC9B79E, 0.27, 0.12, -0.4, 2.3);
}

// ---------------------------------------------------------------- materials
const jellyMat = new THREE.MeshPhysicalMaterial({
  color: PAL.jelly, transmission: 0.92, thickness: 0.15, roughness: 0.1, ior: 1.34,
  attenuationColor: col(PAL.core), attenuationDistance: 0.15,
  clearcoat: 1.0, clearcoatRoughness: 0.06, metalness: 0,
  sheen: 0.6, sheenColor: col(PAL.jelly), sheenRoughness: 0.45,
  emissive: col(PAL.jelly), emissiveIntensity: 0.17,
  specularIntensity: 1.0,
});
const coreMat = new THREE.MeshStandardMaterial({ color: PAL.core, roughness: 0.42, emissive: col(PAL.core), emissiveIntensity: 0.6 });
const suckerMat = new THREE.MeshStandardMaterial({ color: PAL.suckers, roughness: 0.38, emissive: col(PAL.suckers), emissiveIntensity: 0.08 });
const BASE = {
  jelly: col(PAL.jelly), core: col(PAL.core), accent: col(PAL.accent),
  att: col(PAL.core), emis: col(PAL.jelly),
};

// ================================================================= PHYSICS
// ---------------------------------------------------------------- mantle cage (500 particles)
const SEMI = [0.11, 0.115, 0.105];
const RINGS = 19, SEGS = 26;
const NS = 2 + RINGS * SEGS;   // 496 surface particles
const NC = NS + 4;             // + 4 interior axis particles = 500
const cq = new Float64Array(NC * 3);            // rest, local
const cx = new Float64Array(NC * 3), cpv = new Float64Array(NC * 3), cvel = new Float64Array(NC * 3);
const cgoal = new Float64Array(NC * 3);
{
  let n = 0;
  const put = (x, y, z) => { cq[n * 3] = x; cq[n * 3 + 1] = y; cq[n * 3 + 2] = z; n++; };
  put(0, SEMI[1], 0);
  for (let r = 1; r <= RINGS; r++) {
    const ph = Math.PI * r / (RINGS + 1);
    for (let s = 0; s < SEGS; s++) {
      const th = 2 * Math.PI * s / SEGS + (r % 2) * Math.PI / SEGS;
      put(SEMI[0] * Math.sin(ph) * Math.cos(th), SEMI[1] * Math.cos(ph), SEMI[2] * Math.sin(ph) * Math.sin(th));
    }
  }
  put(0, -SEMI[1], 0);
  for (const y of [-0.05, -0.017, 0.017, 0.05]) put(0, y, 0);
}
const ringIdx = (r, s) => 1 + (r - 1) * SEGS + ((s % SEGS) + SEGS) % SEGS;
const cTris = [];
for (let s = 0; s < SEGS; s++) cTris.push(0, ringIdx(1, s + 1), ringIdx(1, s));
for (let r = 1; r < RINGS; r++) {
  for (let s = 0; s < SEGS; s++) {
    // stagger: odd rings are rotated by half a segment
    const a = ringIdx(r, s), b = ringIdx(r, s + 1);
    const odd = r % 2 === 1;
    const c = ringIdx(r + 1, odd ? s + 1 : s), d = ringIdx(r + 1, odd ? s : s - 1);
    // a,b on ring r; c is "under" between a and b; d under-left of a
    cTris.push(a, b, c);
    cTris.push(a, c, d);
  }
}
for (let s = 0; s < SEGS; s++) cTris.push(NS - 1, ringIdx(RINGS, s), ringIdx(RINGS, s + 1));
const cTri = new Uint16Array(cTris);
function triVolume(arr, cxm, cym, czm) {
  let V = 0;
  for (let t = 0; t < cTri.length; t += 3) {
    const a = cTri[t] * 3, b = cTri[t + 1] * 3, c = cTri[t + 2] * 3;
    const ax = arr[a] - cxm, ay = arr[a + 1] - cym, az = arr[a + 2] - czm;
    const bx = arr[b] - cxm, by = arr[b + 1] - cym, bz = arr[b + 2] - czm;
    const qx = arr[c] - cxm, qy = arr[c + 1] - cym, qz = arr[c + 2] - czm;
    V += ax * (by * qz - bz * qy) + ay * (bz * qx - bx * qz) + az * (bx * qy - by * qx);
  }
  return V / 6;
}
if (triVolume(cq, 0, 0, 0) < 0) for (let t = 0; t < cTri.length; t += 3) { const x = cTri[t + 1]; cTri[t + 1] = cTri[t + 2]; cTri[t + 2] = x; }
const V0 = triVolume(cq, 0, 0, 0);
// edges for distance constraints
const cEdges = []; {
  const seen = new Set();
  for (let t = 0; t < cTri.length; t += 3) for (let e = 0; e < 3; e++) {
    const i = cTri[t + e], j = cTri[t + (e + 1) % 3];
    const k = i < j ? i * 1000 + j : j * 1000 + i;
    if (!seen.has(k)) { seen.add(k); cEdges.push(i, j); }
  }
}
const cEdge = new Uint16Array(cEdges);
const cEdgeL = new Float64Array(cEdge.length / 2);
for (let e = 0; e < cEdgeL.length; e++) {
  const i = cEdge[e * 2] * 3, j = cEdge[e * 2 + 1] * 3;
  cEdgeL[e] = Math.hypot(cq[i] - cq[j], cq[i + 1] - cq[j + 1], cq[i + 2] - cq[j + 2]);
}
const cGrad = new Float64Array(NS * 3);

// ---------------------------------------------------------------- tentacles
const TN = 8, TP = 25, TSEG = 24, TLEN = 0.35, L0 = TLEN / TSEG;
const R_ROOT = 0.02, R_TIP = 0.002;
const tx = new Float64Array(TN * TP * 3), tpv = new Float64Array(TN * TP * 3), tvel = new Float64Array(TN * TP * 3);
const tRad = new Float64Array(TN * TP);        // current collision radius
const tSegScale = new Float64Array(TN * TSEG).fill(1);
const baseRad = new Float64Array(TP);
for (let i = 0; i < TP; i++) baseRad[i] = R_ROOT + (R_TIP - R_ROOT) * Math.pow(i / TSEG, 0.85);
const bendK = new Float64Array(TSEG);
for (let i = 0; i < TSEG; i++) bendK[i] = 0.6 + (0.1 - 0.6) * (i / (TSEG - 1));
const kRest = new Float64Array(TSEG);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
for (let i = 0; i < TSEG; i++) {
  const s = i * L0;
  kRest[i] = -4.2 * (1 - smooth(0.0, 0.13, s)) + 15 * smooth(0.15, 0.35, s);
}
const T = [];
for (let k = 0; k < TN; k++) {
  const th = (k + 0.5) * Math.PI / 4;
  const r = [Math.cos(th), 0, Math.sin(th)];
  const d = [0.56 * r[0], -0.83, 0.56 * r[2]]; const dl = Math.hypot(...d);
  T.push({
    th, rootL: [0.068 * r[0], -0.1, 0.068 * r[2]],
    dirL: d.map((v) => v / dl),
    axisL: [-Math.sin(th), 0, Math.cos(th)],       // r x up: rotation toward aboral side
    phase: k * 0.79 + (k % 2) * 1.3,
    stretch: 1, curl: 0, recoilT: -10, tickleT: -10, grabbed: -1, target: new THREE.Vector3(),
  });
}

// ---------------------------------------------------------------- state
const sim = {
  t: 0, softness: 0.3, current: 0.3, idle: true,
  mode: 'idle', releaseT: 0, pulseN: 0, nextPulse: 0, pulsePhase0: 0,
  m: new THREE.Vector3(), q: new THREE.Quaternion(), R: new Float64Array(9), S: [1, 1, 1],
  poke: null, flushT: -10, squintT: -10, blinkT: 2, blinkNext: 3.2,
  boundX: 0.22, boundY: 0.22, volMin: 1, volMax: 1, vol: 1, maxPen: 0, maxStretch: 1,
};
const IDQ = new THREE.Quaternion();
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
const _v = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

function quatToMat(q, M) {
  const x = q.x, y = q.y, z = q.z, w = q.w;
  M[0] = 1 - 2 * (y * y + z * z); M[1] = 2 * (x * y - z * w); M[2] = 2 * (x * z + y * w);
  M[3] = 2 * (x * y + z * w); M[4] = 1 - 2 * (x * x + z * z); M[5] = 2 * (y * z - x * w);
  M[6] = 2 * (x * z - y * w); M[7] = 2 * (y * z + x * w); M[8] = 1 - 2 * (x * x + y * y);
}
const _M = new Float64Array(9), _G = new Float64Array(9), _A = new Float64Array(9);
// Müller et al. 2016, robust rotation extraction (warm-started quaternion)
function extractRotation(A, q, iters) {
  for (let it = 0; it < iters; it++) {
    quatToMat(q, _M);
    // columns r_c = (M[c], M[3+c], M[6+c]); a_c likewise
    let ox = 0, oy = 0, oz = 0, dot = 0;
    for (let c = 0; c < 3; c++) {
      const rx = _M[c], ry = _M[3 + c], rz = _M[6 + c];
      const ax = A[c], ay = A[3 + c], az = A[6 + c];
      ox += ry * az - rz * ay; oy += rz * ax - rx * az; oz += rx * ay - ry * ax;
      dot += rx * ax + ry * ay + rz * az;
    }
    const inv = 1 / (Math.abs(dot) + 1e-9);
    ox *= inv; oy *= inv; oz *= inv;
    const w = Math.hypot(ox, oy, oz);
    if (w < 1e-9) break;
    _v.set(ox / w, oy / w, oz / w);
    _q2.setFromAxisAngle(_v, w);
    q.premultiply(_q2).normalize();
  }
}

function idlePulse(t) {
  // 0..1 contraction amount; period 2.5 s, quick squeeze, slow relax
  const ph = ((t - sim.pulsePhase0) % 2.5 + 2.5) % 2.5 / 2.5;
  return ph < 0.18 ? smooth(0, 0.18, ph) : 1 - smooth(0.18, 0.62, ph);
}
function curlEnvelope(tt) {
  let c = 0;
  const r = sim.t - tt.recoilT;

  if (pointer.hist.length >= 2 && h1.t - h0.t > 0.004) {
    const speed = h0.p.distanceTo(h1.p) / (h1.t - h0.t);
    pointer.speed = speed;
    if (speed > 1.5) tickle(h0.x, h0.y, h1.x, h1.y);
  }
}
function tickle(x0, y0, x1, y1) {
  const ppm = pxPerMeterAt(sim.m);
  let any = false;
  for (let k = 0; k < TN; k++) {
    let hitK = false;
    for (let i = 2; i < TP && !hitK; i++) {
      const b = (k * TP + i) * 3;
      toScreen(tx[b], tx[b + 1], tx[b + 2], _s);
      const dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy || 1;
      const t = Math.min(1, Math.max(0, ((_s.x - x0) * dx + (_s.y - y0) * dy) / l2));
      const d = Math.hypot(_s.x - x0 - dx * t, _s.y - y0 - dy * t);
      if (d < 0.045 * ppm + tRad[k * TP + i] * ppm) hitK = true;
    }
    if (hitK) {
      const tt = T[k];
      const age = sim.t - tt.tickleT;
      if (age > 1.0 || age < 0) tt.tickleT = sim.t;
      else if (age > 0.25) tt.tickleT = sim.t - 0.25; // keep it curled while tickling continues
      any = true;
    }
  }
  if (any) { sim.squintT = (sim.t - sim.squintT > 0.12 && sim.t - sim.squintT < 0.9) ? sim.t - 0.12 : sim.t; used(); }
}
function onUp(e) {
  if (!grab.type || e.pointerId !== grab.id) return;
  if (grab.type === 'tent') {
    const tt = T[grab.k];
    tt.grabbed = -1; tt.recoilT = sim.t;
  } else if (grab.moved) {
    // toss: clamp release speed, then drift
    let vx = 0, vy = 0, vz = 0;
    for (let i = 0; i < NC; i++) { vx += cvel[i * 3]; vy += cvel[i * 3 + 1]; vz += cvel[i * 3 + 2]; }
    vx /= NC; vy /= NC; vz /= NC;
    const sp = Math.hypot(vx, vy, vz), cap = 0.7;
    if (sp > cap) { const f = cap / sp - 1; for (let i = 0; i < NC; i++) { cvel[i * 3] += vx * f; cvel[i * 3 + 1] += vy * f; cvel[i * 3 + 2] += vz * f; } }
    sim.mode = 'tossed'; sim.releaseT = sim.t;
  }
  grab.type = null; grab.id = -1;
  controls.enabled = true;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) { /* already released */ }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('pointerleave', () => { pointer.inside = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// orbit (registered after our handlers so a grab can disable it first)
const controls = new OrbitControls(camera, canvas);
controls.target.copy(CAM_TARGET);
controls.enablePan = false;
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.6;
controls.minDistance = 1.0; controls.maxDistance = 2.4;
controls.minAzimuthAngle = -Math.PI / 3; controls.maxAzimuthAngle = Math.PI / 3;
controls.minPolarAngle = THREE.MathUtils.degToRad(35); controls.maxPolarAngle = THREE.MathUtils.degToRad(96);

// ---------------------------------------------------------------- UI
const soft = document.getElementById('soft'), cur = document.getElementById('cur');
const softOut = document.getElementById('softOut'), curOut = document.getElementById('curOut');
const panel = document.getElementById('panel');
soft.addEventListener('input', () => { sim.softness = +soft.value; softOut.textContent = (+soft.value).toFixed(2); });
cur.addEventListener('input', () => { sim.current = +cur.value; curOut.textContent = (+cur.value).toFixed(2); });
document.getElementById('reset').addEventListener('click', () => {
  soft.value = 0.3; cur.value = 0.3; soft.dispatchEvent(new Event('input')); cur.dispatchEvent(new Event('input'));
  grab.type = null; controls.enabled = true;
  resetSim(); fitCamera(true);
});

function fitDistance() {
  const aspect = innerWidth / innerHeight;
  const tanH = Math.tan(THREE.MathUtils.degToRad(17.5));
  return THREE.MathUtils.clamp(0.64 / (2 * tanH * aspect), 1.6, 2.4);
}
function fitCamera(resetView) {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  camera.aspect = W / H;
  if (resetView) { placeCamera(fitDistance()); controls.update(); }
  // shift the projection so the hero sits in the free area beside / above the panel
  const pr = panel.getBoundingClientRect();
  let ox = 0, oy = 0;
  const narrow = W <= 700;
  if (!narrow) ox = -(pr.right) / 2;
  else { const top = 56, free = (top + pr.top) / 2; oy = H / 2 - free; }
  camera.setViewOffset(W, H, ox, oy, W, H);
  camera.updateProjectionMatrix();
  // how far a toss may go before it would slide under the panel / off screen
  const d = camera.position.distanceTo(CAM_TARGET);
  const mpp = 2 * d * Math.tan(THREE.MathUtils.degToRad(17.5)) / H;
  const hx = narrow ? W / 2 : (W - pr.right) / 2, hy = narrow ? (pr.top - 56) / 2 : H / 2;
  sim.boundX = THREE.MathUtils.clamp(hx * mpp - 0.29, 0.04, 0.24);
  sim.boundY = THREE.MathUtils.clamp(hy * mpp - 0.29, 0.04, 0.2);
}
addEventListener('resize', () => fitCamera(false));

// ================================================================= LOOP
const stats = { fps: 0, frames: [], windowFps: [], halved: false, frameMs: 0 };
let acc = 0, last = performance.now(), fpsWinStart = last, fpsWinCount = 0, lowWins = 0, started = last;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t0 = performance.now();
  if (!window.__jellyPaused) {
    acc += dt;
    let n = 0;
    while (acc >= SUB && n < 8) { physicsStep(SUB); acc -= SUB; n++; }
    if (n === 8) acc = 0;
  }
  if (window.__jellyNoRender) return;
  updateHero(dt);
  controls.update();
  renderCaustics(now / 1000);
  renderer.render(scene, camera);
  stats.frameMs = performance.now() - t0;
  // fps monitor: if a 1 s window drops under 55 fps, halve the transmission resolution
  fpsWinCount++;
  if (now - fpsWinStart >= 1000) {
    stats.fps = fpsWinCount * 1000 / (now - fpsWinStart);
    stats.windowFps.push(stats.fps); if (stats.windowFps.length > 30) stats.windowFps.shift();
    fpsWinStart = now; fpsWinCount = 0;
    if (now - started > 2000 && stats.fps < 55) { if (++lowWins >= 2 && !transmissionHalf) { transmissionHalf = true; stats.halved = true; } }
    else lowWins = 0;
  }
}

resetSim();
fitCamera(true);
updateHero(0);
renderer.setAnimationLoop(tick);

// ---------------------------------------------------------------- test / inspection hooks
window.__jelly = {
  sim, T, stats, V0, NC, camera, controls,
  get transmissionHalf() { return transmissionHalf; },
  screenOfParticle(k, i) { const b = (k * TP + i) * 3; const o = {}; toScreen(tx[b], tx[b + 1], tx[b + 2], o); return o; },
  screenOfMantle() { const o = {}; toScreen(sim.m.x, sim.m.y + 0.04, sim.m.z, o); return o; },
  screenOfWorld(x, y, z) { const o = {}; toScreen(x, y, z, o); return o; },
  heroScreenBox() {
    const o = {}; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const add = (x, y, z) => { toScreen(x, y, z, o); x0 = Math.min(x0, o.x); x1 = Math.max(x1, o.x); y0 = Math.min(y0, o.y); y1 = Math.max(y1, o.y); };
    for (let v = 0; v < mantlePos.length; v += 30) add(mantlePos[v], mantlePos[v + 1], mantlePos[v + 2]);
    for (let k = 0; k < TN; k++) for (let i = 0; i < TP; i++) { const b = (k * TP + i) * 3; add(tx[b], tx[b + 1], tx[b + 2]); }
    return { x0, y0, x1, y1 };
  },
  heroWorldBox() {
    let y0 = 1e9, y1 = -1e9;
    for (let v = 1; v < mantlePos.length; v += 3) { y0 = Math.min(y0, mantlePos[v]); y1 = Math.max(y1, mantlePos[v]); }
    for (let k = 0; k < TN; k++) for (let i = 0; i < TP; i++) { const y = tx[(k * TP + i) * 3 + 1]; y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    return { y0, y1, h: y1 - y0 };
  },
  volume() { return triVolume(cx, sim.m.x, sim.m.y, sim.m.z) / V0; },
  comSpeed: comVelocity,
  dentDepth() {
    // how far the poked spot sits inside the undisturbed (goal) surface
    const pk = sim.poke; if (!pk) return 0;
    let best = 0;
    for (let i = 0; i < NS; i++) if (pk.w[i] > 0.6) {
      const b = i * 3, qx = cq[b] * sim.S[0], qy = cq[b + 1] * sim.S[1], qz = cq[b + 2] * sim.S[2], G = sim.R;
      const gx = sim.m.x + G[0] * qx + G[1] * qy + G[2] * qz, gy = sim.m.y + G[3] * qx + G[4] * qy + G[5] * qz, gz = sim.m.z + G[6] * qx + G[7] * qy + G[8] * qz;
      best = Math.max(best, -((cx[b] - gx) * pk.n.x + (cx[b + 1] - gy) * pk.n.y + (cx[b + 2] - gz) * pk.n.z));
    }
    return best;
  },
  // motion energy relative to the undisturbed idle goal (for the rest test)
  motion() {
    let cv = 0;
    let vx = 0, vy = 0, vz = 0;
    for (let i = 0; i < NC; i++) { vx += cvel[i * 3]; vy += cvel[i * 3 + 1]; vz += cvel[i * 3 + 2]; }
    vx /= NC; vy /= NC; vz /= NC;
    for (let i = 0; i < NC; i++) cv = Math.max(cv, Math.hypot(cvel[i * 3] - vx, cvel[i * 3 + 1] - vy, cvel[i * 3 + 2] - vz));
    let tv = 0;
    for (let i = 0; i < TN * TP; i++) tv = Math.max(tv, Math.hypot(tvel[i * 3], tvel[i * 3 + 1], tvel[i * 3 + 2]));
    return { cage: cv, tent: tv, com: Math.hypot(vx, vy, vz) };
  },
  perturb(s) {
    for (let i = 0; i < NC * 3; i++) cvel[i] += (Math.random() - 0.5) * 2 * s;
    for (let i = 3; i < TN * TP * 3; i++) tvel[i] += (Math.random() - 0.5) * 2 * s;
  },
  step(seconds) { const n = Math.round(seconds / SUB); for (let i = 0; i < n; i++) physicsStep(SUB); updateHero(SUB); },
  penetration() {
    // worst current overlap (m): tentacle/tentacle capsules and tentacle/mantle
    let worst = 0;
    const NSg = TN * TSEG;
    for (let A = 0; A < NSg; A++) for (let B = A + 1; B < NSg; B++) {
      const ka = (A / TSEG) | 0, ia = A % TSEG, kb = (B / TSEG) | 0, ib = B % TSEG;
      if (ka === kb && ib - ia < 4) continue; if (ia === 0 && ib === 0) continue;
      const a0 = (ka * TP + ia) * 3, a1 = a0 + 3, b0 = (kb * TP + ib) * 3, b1 = b0 + 3;
      segSeg(tx[a0], tx[a0 + 1], tx[a0 + 2], tx[a1], tx[a1 + 1], tx[a1 + 2], tx[b0], tx[b0 + 1], tx[b0 + 2], tx[b1], tx[b1 + 1], tx[b1 + 2]);
      const s = _st[0], t = _st[1];
      const d = Math.hypot(tx[a0] + (tx[a1] - tx[a0]) * s - tx[b0] - (tx[b1] - tx[b0]) * t, tx[a0 + 1] + (tx[a1 + 1] - tx[a0 + 1]) * s - tx[b0 + 1] - (tx[b1 + 1] - tx[b0 + 1]) * t, tx[a0 + 2] + (tx[a1 + 2] - tx[a0 + 2]) * s - tx[b0 + 2] - (tx[b1 + 2] - tx[b0 + 2]) * t);
      const rA = tRad[ka * TP + ia] * (1 - s) + tRad[ka * TP + ia + 1] * s, rB = tRad[kb * TP + ib] * (1 - t) + tRad[kb * TP + ib + 1] * t;
      worst = Math.max(worst, rA + rB - d);
    }
    const R = sim.R, S = sim.S, m = sim.m;
    let body = 0;
    for (let k = 0; k < TN; k++) for (let i = 2; i < TP; i++) {
      const b = (k * TP + i) * 3, r = tRad[k * TP + i];
      const dx = tx[b] - m.x, dy = tx[b + 1] - m.y, dz = tx[b + 2] - m.z;
      const lx = R[0] * dx + R[3] * dy + R[6] * dz, ly = R[1] * dx + R[4] * dy + R[7] * dz, lz = R[2] * dx + R[5] * dy + R[8] * dz;
      const e = Math.sqrt((lx / (SEMI[0] * S[0] + r)) ** 2 + (ly / (SEMI[1] * S[1] + r)) ** 2 + (lz / (SEMI[2] * S[2] + r)) ** 2);
      if (e < 1) body = Math.max(body, (1 - e) * Math.hypot(lx, ly, lz) / Math.max(e, 1e-6) * e);
    }
    return { tentacle: worst, body };
  },
  maxStretchNow() { let best = 1; for (let k = 0; k < TN; k++) best = Math.max(best, T[k].stretch); return best; },
  curls() { return T.map((t) => +t.curl.toFixed(3)); },
  counts: { cage: NC, mantleVerts: mantleSkin.n, mantleTris: nets.index.length / 3, suckers: TN * SUCK_PER, segments: TSEG },
};
</script>

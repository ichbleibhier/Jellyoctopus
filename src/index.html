<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelly Octopus</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --water: #0F3A4A; --jelly: #B79CFF; --core: #6E4BD8; --suckers: #F1E6FF;
    --accent: #FF8FB8; --warm: #FFF0D6; --caustic: #BFF4FF;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--water); }
  body { font: 500 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--suckers); }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; outline: none; }
  #title {
    position: fixed; top: 14px; left: 20px; margin: 0;
    font: 700 30px/1.1 "Baloo 2", system-ui, sans-serif; color: var(--suckers);
    letter-spacing: .2px; pointer-events: none; user-select: none;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .25);
  }
  #panel {
    position: fixed; left: 16px; top: 68px; width: 220px; box-sizing: border-box;
    padding: 14px 16px 16px; border-radius: 16px;
    background: rgba(15, 58, 74, .6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(241, 230, 255, .12); touch-action: manipulation;
  }
  .row { margin-bottom: 12px; }
  .row label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .row output { font-variant-numeric: tabular-nums; opacity: .8; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
  button {
    width: 100%; height: 34px; border: 0; border-radius: 10px; cursor: pointer;
    font: 600 14px system-ui, sans-serif; color: var(--water); background: var(--suckers);
  }
  button:hover { background: #fff; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 2px; border-radius: 10px; background: rgba(241, 230, 255, .14); }
  .seg button { height: 26px; border-radius: 8px; font-size: 12.5px; background: transparent; color: var(--suckers); }
  .seg button:hover { background: rgba(241, 230, 255, .18); }
  .seg button[aria-pressed="true"] { background: var(--suckers); color: var(--water); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #hint {
    position: fixed; bottom: 26px; left: calc(118px + 50%); transform: translateX(-50%);
    padding: 7px 14px; border-radius: 999px; background: rgba(15, 58, 74, .55);
    font-size: 14px; letter-spacing: .3px; white-space: nowrap; pointer-events: none;
    transition: opacity .9s ease;
  }
  #hint.gone { opacity: 0; }
  @media (max-width: 700px) {
    #title { font-size: 30px; top: 12px; left: 16px; }
    #panel { top: auto; bottom: 16px; left: 16px; padding: 10px 14px 12px; }
    .row { margin-bottom: 8px; }
    #hint { bottom: auto; top: 58px; left: 16px; transform: none; font-size: 12.5px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<h1 id="title">Jelly Octopus</h1>
<div id="panel">
  <div class="row">
    <label for="soft">Softness <output id="softOut">0.30</output></label>
    <input id="soft" type="range" min="0.1" max="1" step="0.01" value="0.3">
  </div>
  <div class="row">
    <label for="cur">Current <output id="curOut">0.30</output></label>
    <input id="cur" type="range" min="0" max="1" step="0.01" value="0.3">
  </div>
  <div class="row">
    <label id="qLabel">Quality <output id="qOut">Auto · High</output></label>
    <div id="quality" class="seg" role="group" aria-labelledby="qLabel">
      <button type="button" data-q="auto" aria-pressed="true">Auto</button><button type="button" data-q="low" aria-pressed="false">Low</button><button type="button" data-q="medium" aria-pressed="false">Med</button><button type="button" data-q="high" aria-pressed="false">High</button>
    </div>
  </div>
  <button id="reset" type="button">Reset</button>
</div>
<div id="hint">drag a tentacle · poke · tickle · toss</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
console.log('THREE.REVISION', THREE.REVISION);

// ---------------------------------------------------------------- palette
const PAL = {
  jelly: 0xB79CFF, core: 0x6E4BD8, suckers: 0xF1E6FF, water: 0x0F3A4A,
  sand: 0xE9D9B8, accent: 0xFF8FB8, warm: 0xFFF0D6, caustic: 0xBFF4FF,
  deep: 0x0A2E3D, shallow: 0x2E7F8F, sunlight: 0xFFF4D6, coralPink: 0xF27A7D, coralOrange: 0xF2A65A,
  seaFan: 0x8E5BB5, kelp: 0x6E7F2E, kelpLight: 0xA3B04A, fishSilver: 0xC9D6DC, fishYellow: 0xF2C94C,
};
const col = (h) => new THREE.Color(h);

const mq = matchMedia('(prefers-reduced-motion: reduce)');
let reducedMotion = mq.matches;
mq.addEventListener('change', (e) => { reducedMotion = e.matches; });

// ---------------------------------------------------------------- world constants
const HOME_DEFAULT = new THREE.Vector3(0, 0.15, 0);   // mantle centre; hero bbox centre ~ y 0
const HOME = HOME_DEFAULT.clone();                    // where the hero rests: moves when it is carried
const SEABED = -0.35;                          // 0.35 m below the hero
const SUB = 1 / 120;                           // fixed PBD substep
// where the hero can be carried: open sand inside the reef ring, between the sand and mid-water
const PLAY = { r: 1.9, yMin: SEABED + 0.46, yMax: SEABED + 2.4 };
function clampPlay(v) {
  const r = Math.hypot(v.x, v.z); if (r > PLAY.r) { v.x *= PLAY.r / r; v.z *= PLAY.r / r; }
  v.y = Math.min(PLAY.yMax, Math.max(PLAY.yMin, v.y)); return v;
}

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
if (!renderer.capabilities.isWebGL2) document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;top:40%;width:100%;text-align:center">WebGL2 required</p>');
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.setClearColor(PAL.deep, 1);
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
canvas.tabIndex = 0;

// Halving the transmission pass: three r160 sizes its transmission target from
// getDrawingBufferSize(), which nothing else in the renderer calls.
const baseDBS = renderer.getDrawingBufferSize.bind(renderer);
let transmissionHalf = false;
renderer.getDrawingBufferSize = (t) => {
  baseDBS(t);
  if (transmissionHalf) t.set(Math.max(1, Math.floor(t.x / 2)), Math.max(1, Math.floor(t.y / 2)));
  return t;
};

const scene = new THREE.Scene();
// the water volume replaces fog (see the fog chunk override below); Fog only switches it on
scene.fog = new THREE.Fog(PAL.shallow, 1, 2);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.03, 60);
// OrbitControls drives a proxy; the render camera copies it exactly inside the old orbit range.
// Dragging further down than the old floor (96°) keeps the camera where it is and tilts it to
// look up at the surface instead.
const orbitCam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.03, 60);
const CAM_TARGET = new THREE.Vector3(0, 0, 0);
const POLAR_FLOOR = THREE.MathUtils.degToRad(96), LOOK_UP_RANGE = THREE.MathUtils.degToRad(34);
function placeCamera(dist) {
  const el = THREE.MathUtils.degToRad(-5);
  orbitCam.position.set(0, Math.sin(el) * dist, Math.cos(el) * dist).add(CAM_TARGET);
  orbitCam.lookAt(CAM_TARGET);
  syncCamera();
}
const _sph = new THREE.Spherical();
function syncCamera() {
  _sph.setFromVector3(_sph_v.copy(orbitCam.position).sub(CAM_TARGET));
  if (_sph.phi <= POLAR_FLOOR + 1e-6) {
    camera.position.copy(orbitCam.position); camera.quaternion.copy(orbitCam.quaternion);
  } else {
    const extra = _sph.phi - POLAR_FLOOR;
    _sph.phi = POLAR_FLOOR;
    camera.position.setFromSpherical(_sph).add(CAM_TARGET);
    camera.lookAt(CAM_TARGET);
    camera.rotateX(extra * 1.5);
  }
  camera.updateMatrixWorld();
}
const _sph_v = new THREE.Vector3();

// ================================================================= WATER WORLD (optics)
// Seabed is 4 m deep; the surface sits 4 m above the sand.
const SURF_Y = SEABED + 4.0;
// Sun travel direction underwater: 20° off vertical (slanting left→right, away from camera).
const SUN_W = new THREE.Vector3(0.30, -0.94, -0.17).normalize();
// The same ray in air (Snell: horizontal component × 1.333).
const SUN_AIR = (() => { const h = new THREE.Vector2(SUN_W.x, SUN_W.z).multiplyScalar(1.333); return new THREE.Vector3(h.x, -Math.sqrt(1 - h.lengthSq()), h.y); })();
const CUR_DIR = new THREE.Vector2(1, 0.35).normalize();
const v3 = (c, k = 1) => `vec3(${(c.r * k).toFixed(5)}, ${(c.g * k).toFixed(5)}, ${(c.b * k).toFixed(5)})`;
const v3v = (v) => `vec3(${v.x.toFixed(5)}, ${v.y.toFixed(5)}, ${v.z.toFixed(5)})`;

// shared world uniforms (one object, referenced by every patched material)
const WU = {
  uCaus: { value: null }, uCausRect: { value: new THREE.Vector3(-7, -7, 14) }, uCausOn: { value: 1 },
  uSeabedY: { value: SEABED }, uSurfY: { value: SURF_Y },
  uWaveT: { value: 0 }, uSway: { value: 0 }, uCur: { value: 0.3 }, uSwim: { value: 0 }, uJellyT: { value: 0 },
  uShadow: null, // set by seabed
};

const WATER_GLSL = /* glsl */`
#ifndef WATER_GLSL_DEF
#define WATER_GLSL_DEF
const vec3 SUN_W = ${v3v(SUN_W)};
const vec3 SUN_AIR = ${v3v(SUN_AIR)};
const vec3 SUN_COL = ${v3(col(PAL.sunlight), 3.2)};
const vec3 WATER_ABS = vec3(0.45, 0.07, 0.03);
const vec3 WATER_EXT = WATER_ABS + vec3(0.055);
const vec3 W_DEEP = ${v3(col(PAL.deep))};
const vec3 W_SHALLOW = ${v3(col(PAL.shallow))};
const vec2 CUR_DIR = vec2(${CUR_DIR.x.toFixed(5)}, ${CUR_DIR.y.toFixed(5)});
// radiance of the water itself seen along direction d (in-scattering toward PALETTE shallow)
vec3 waterIn(vec3 d) {
  float u = d.y;
  vec3 c = mix(W_DEEP * 0.7, W_SHALLOW * 0.31, smoothstep(-0.6, 0.85, u));
  float s = max(dot(d, -SUN_W), 0.0);
  c += W_SHALLOW * 0.16 * pow(s, 5.0);
  return c;
}
#endif
`;
const CAUS_RES_GLSL = '512.0';
const CAUS_GLSL = /* glsl */`
uniform sampler2D uCaus;
uniform vec3 uCausRect;
uniform float uSeabedY, uSurfY, uCausOn;
// cubic B-spline filtered lookup (4 bilinear taps): no texel blocks in close-ups
vec3 causTex(vec2 uv) {
  vec2 res = vec2(${CAUS_RES_GLSL}), st = uv * res - 0.5, i = floor(st), f = st - i;
  vec2 w0 = (1.0 - f) * (1.0 - f) * (1.0 - f) / 6.0, w1 = (4.0 - 6.0 * f * f + 3.0 * f * f * f) / 6.0;
  vec2 w3 = f * f * f / 6.0, w2 = 1.0 - w0 - w1 - w3;
  vec2 s0 = w0 + w1, s1 = w2 + w3, o0 = (i - 0.5 + w1 / s0) / res, o1 = (i + 1.5 + w3 / s1) / res;
  return (texture2D(uCaus, vec2(o0.x, o0.y)).rgb * s0.x + texture2D(uCaus, vec2(o1.x, o0.y)).rgb * s1.x) * s0.y
       + (texture2D(uCaus, vec2(o0.x, o1.y)).rgb * s0.x + texture2D(uCaus, vec2(o1.x, o1.y)).rgb * s1.x) * s1.y;
}
// caustic intensity (mean 1) arriving at a world point: follow the refracted sun ray down to the
// seabed plane, where the map was accumulated
vec3 causticAt(vec3 wp) {
  float s = max(wp.y - uSeabedY, 0.0) / (-SUN_W.y);
  vec2 q = wp.xz + SUN_W.xz * s;
  vec2 uv = (q - uCausRect.xy) / uCausRect.z;
  vec3 c = causTex(uv);
  c = mix(vec3(dot(c, vec3(0.3333))), c, 0.4);            // faint colour fringe
  vec2 e = smoothstep(vec2(0.0), vec2(0.1), uv) * smoothstep(vec2(1.0), vec2(0.9), uv);
  return mix(vec3(1.0), c, e.x * e.y * uCausOn);
}
`;
const GERSTNER_GLSL = /* glsl */`
uniform float uWaveT, uCur;
// four summed Gerstner waves: (dir.xy, wavelength m, amplitude m)
const vec4 WV0 = vec4(1.0, 0.25, 1.8, 0.06);
const vec4 WV1 = vec4(0.55, 0.85, 1.1, 0.03);
const vec4 WV2 = vec4(-0.45, 0.9, 0.7, 0.015);
const vec4 WV3 = vec4(0.85, -0.55, 0.4, 0.008);
float gHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float gNoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(gHash(i), gHash(i + vec2(1.0, 0.0)), f.x), mix(gHash(i + vec2(0.0, 1.0)), gHash(i + 1.0), f.x), f.y);
}
// one Gerstner train; its phase and height drift slowly across space so the sum never tiles
void gwave(vec4 w, float sd, vec2 xz, inout vec3 off) {
  float wob = 0.7 * (gNoise(xz * 0.23 - sd * 2.9) - 0.5);
  vec2 d = normalize(w.xy); d = vec2(d.x * cos(wob) - d.y * sin(wob), d.x * sin(wob) + d.y * cos(wob));
  float k = 6.2831853 / w.z;
  float A = w.w * (0.65 + 0.7 * uCur) * (0.55 + 0.8 * gNoise(xz * 0.37 + sd * 7.3));
  float c = sqrt(9.81 / k);
  float Q = 0.5 / (k * w.w * 1.35 * 4.0);
  float ph = 6.0 * gNoise(xz * 0.33 + vec2(sd * 3.1, -sd * 5.7)) + 3.0 * gNoise(xz * 0.71 - sd);
  // the current advects the wave train (Doppler) as well as feeding its height
  float f = k * (dot(d, xz) - (c + 0.35 * uCur * dot(d, CUR_DIR)) * uWaveT) + ph;
  off.xz += Q * A * d * cos(f); off.y += A * sin(f);
}
vec3 gOff(vec2 xz) {
  vec3 off = vec3(0.0);
  gwave(WV0, 1.0, xz, off); gwave(WV1, 2.0, xz, off); gwave(WV2, 3.0, xz, off); gwave(WV3, 4.0, xz, off);
  return off;
}
vec3 gerstner(vec2 xz, out vec3 nrm) {
  const float e = 0.012;
  vec3 o = gOff(xz), ox = gOff(xz + vec2(e, 0.0)), oz = gOff(xz + vec2(0.0, e));
  vec3 tx = vec3(e, 0.0, 0.0) + ox - o, tz = vec3(0.0, 0.0, e) + oz - o;
  nrm = normalize(cross(tz, tx));
  return o;
}
`;

// ---- water volume: replace fog with per-channel absorption + in-scattering along the view ray
THREE.ShaderChunk.fog_pars_vertex = '#ifdef USE_FOG\n varying float vFogDepth;\n varying vec3 vFogDir;\n#endif';
THREE.ShaderChunk.fog_vertex = '#ifdef USE_FOG\n vFogDepth = length(mvPosition.xyz);\n vFogDir = (vec4(mvPosition.xyz, 0.0) * viewMatrix).xyz;\n#endif';
THREE.ShaderChunk.fog_pars_fragment = '#ifdef USE_FOG\n uniform vec3 fogColor;\n varying float vFogDepth;\n varying vec3 vFogDir;\n' + WATER_GLSL + '\n#endif';
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  vec3 wTr = exp(-WATER_EXT * vFogDepth);
  gl_FragColor.rgb = gl_FragColor.rgb * wTr + waterIn(normalize(vFogDir)) * (1.0 - wTr);
#endif`;

// ---- material patch: caustics, light absorbed on the way down, wrap lighting, translucency, sway
// wrap only the diffuse term: specular keeps the true N·L (GGX is unbounded at grazing angles)
const WRAP_CHUNK = THREE.ShaderChunk.lights_physical_pars_fragment.replace(
  'reflectedLight.directDiffuse += irradiance * BRDF_Lambert( material.diffuseColor );',
  'reflectedLight.directDiffuse += saturate( ( dot( geometryNormal, directLight.direction ) + W_WRAP ) / ( 1.0 + W_WRAP ) ) * directLight.color * BRDF_Lambert( material.diffuseColor );');
if (WRAP_CHUNK === THREE.ShaderChunk.lights_physical_pars_fragment) throw new Error('wrap chunk anchor missing');
const SWAY = {
  // anemone tentacles: aT 0 root → 1 tip
  anemone: `
    if (aT > 0.0) {
      vec3 ip = vec3(0.0);
      #ifdef USE_INSTANCING
        ip = instanceMatrix[3].xyz;
      #endif
      float ph = aPh + ip.x * 1.3 + ip.z * 0.7;
      vec3 dW = vec3(CUR_DIR.x, 0.0, CUR_DIR.y) * (0.012 + 0.03 * uCur) * (1.0 + 0.6 * sin(uSway * 1.1 + ph))
              + vec3(sin(uSway * 1.7 + ph), 0.25 * sin(uSway * 2.3 + ph * 1.7), cos(uSway * 1.3 + ph)) * 0.014;
      swayW = dW * aT * aT;
    }`,
  // kelp: aY = height up the stalk (m), aB = position along a blade (0..1); phase lags with height
  kelp: `
    vec3 ip = vec3(0.0);
    #ifdef USE_INSTANCING
      ip = instanceMatrix[3].xyz;
    #endif
    float ph = ip.x * 0.7 + ip.z * 1.1;
    float h = aY;
    float s1 = sin(uSway * 0.8 - h * 1.9 + ph), s2 = sin(uSway * 0.5 - h * 1.3 + ph * 1.7);
    vec3 dW = vec3(CUR_DIR.x, 0.0, CUR_DIR.y) * (0.015 + 0.05 * uCur) * h * h
            + vec3(s1, 0.0, s2 * 0.8) * 0.022 * h * h;
    dW += vec3(sin(uSway * 2.6 + aB * 4.0 + ph + h), 0.0, cos(uSway * 2.1 + aB * 3.0 + ph)) * 0.035 * aB;
    dW.y -= 0.5 * dot(dW.xz, dW.xz) / (h + 0.3);
    swayW = dW;`,
  // seagrass: uv.y 0 base → 1 tip
  grass: `
    vec3 ip = vec3(0.0); float bh = 1.0;
    #ifdef USE_INSTANCING
      ip = instanceMatrix[3].xyz; bh = length(instanceMatrix[1].xyz);
    #endif
    float t = uv.y, ph = ip.x * 3.1 + ip.z * 2.3;
    vec3 dW = (vec3(CUR_DIR.x, 0.0, CUR_DIR.y) * (0.15 + 0.35 * uCur) * (1.0 + 0.4 * sin(uSway * 1.4 + ph))
             + vec3(sin(uSway * 1.9 + ph), 0.0, cos(uSway * 1.5 + ph * 1.3)) * 0.18) * t * t * bh;
    dW.y -= 0.5 * dot(dW.xz, dW.xz) / max(bh, 0.05);
    swayW = dW;`,
  // fish: aX 0 head → 1 tail tip; lateral (x) wave travelling to the tail, head nearly still
  fish: `
    float ph = float(gl_InstanceID) * 2.17;
    float w = sin(uSwim * 6.2831853 - aX * 5.0 + ph);
    transformed.x += 0.0075 * w * (0.08 + 1.3 * aX * aX);`,
  // small jellyfish: aBell 1 on the bell, aT along tentacles
  jelly: `
    float ph = float(gl_InstanceID) * 2.4;
    float pul = 0.5 + 0.5 * sin(uJellyT * 3.14159265 + ph);
    float rim = aBell * smoothstep(0.0, 0.05, -position.y + 0.05);
    transformed.xz *= 1.0 - 0.2 * pul * aBell * (0.4 + 0.6 * rim);
    transformed.y *= 1.0 + 0.12 * pul * aBell;
    transformed.x += aT * aT * 0.03 * sin(uJellyT * 2.0 + aT * 5.0 + ph);
    transformed.z += aT * aT * 0.03 * cos(uJellyT * 1.7 + aT * 4.0 + ph);`,
};
const SWAY_ATTR = { anemone: 'attribute float aT; attribute float aPh;', kelp: 'attribute float aY; attribute float aB;', grass: '', fish: 'attribute float aX;', jelly: 'attribute float aBell; attribute float aT;' };

function patchWorld(mat, o) {
  const opt = Object.assign({ downwell: 1, wrap: 0, transl: 0, sway: null, contact: false, causK: 1, glow: 0 }, o);
  const extraU = { uDW: { value: opt.downwell }, uTransl: { value: opt.transl }, uCausK: { value: opt.causK }, uCausGlow: { value: opt.glow } };
  mat.userData.worldU = extraU;
  mat.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, WU, extraU);
    if (opt.contact) s.uniforms.uShadow = WU.uShadow;
    const sway = opt.sway ? SWAY[opt.sway] : '';
    const rot = sway && opt.sway !== 'fish' && opt.sway !== 'jelly' ? `
      #ifdef USE_INSTANCING
        transformed += inverse(mat3(instanceMatrix)) * swayW;
      #else
        transformed += swayW;
      #endif` : '';
    s.vertexShader = s.vertexShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWP;
        uniform float uSway, uCur, uSwim, uJellyT;
        const vec2 CUR_DIR = vec2(${CUR_DIR.x.toFixed(5)}, ${CUR_DIR.y.toFixed(5)});
        ${opt.sway ? SWAY_ATTR[opt.sway] : ''}`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec3 swayW = vec3(0.0);
        ${sway}
        ${rot}`)
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 cwp = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          cwp = instanceMatrix * cwp;
        #endif
        vWP = (modelMatrix * cwp).xyz;`);
    s.fragmentShader = s.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWP;

function stiffScale() { return Math.pow(0.3 / sim.softness, 0.8); }

const _w3 = [0, 0, 0];
function stepCage(dt) {
  const ss = stiffScale();
  const alpha = Math.min(0.85, 0.3 * ss);
  // ---- velocity: CoM drag + internal damping (0.4) + jets
  let vx = 0, vy = 0, vz = 0;
  for (let i = 0; i < NC; i++) { vx += cvel[i * 3]; vy += cvel[i * 3 + 1]; vz += cvel[i * 3 + 2]; }
  vx /= NC; vy /= NC; vz /= NC;

  const fC = Math.exp(-comDrag * dt), fR = Math.pow(1 - 0.4, dt * 10);
  let nvx = vx * fC, nvy = vy * fC, nvz = vz * fC;
  if (sim.mode === 'idle' && grab.type !== 'mantle') {
    const K = 7;
    nvx += (HOME.x - sim.m.x) * K * dt; nvy += (HOME.y - sim.m.y) * K * dt; nvz += (HOME.z - sim.m.z) * K * dt;
  }
  if (sim.jet) { nvx += sim.jet[0]; nvy += sim.jet[1]; nvz += sim.jet[2]; sim.jet = null; }
  for (let i = 0; i < NC; i++) {
    const b = i * 3;

    cpv[b] = cx[b]; cpv[b + 1] = cx[b + 1]; cpv[b + 2] = cx[b + 2];
    cx[b] += cvel[b] * dt; cx[b + 1] += cvel[b + 1] * dt; cx[b + 2] += cvel[b + 2] * dt;
  }

    if (!grab.follow) grab.follow = grab.target.clone();

      cx[b + 2] += (grab.follow.z + o[2] - cx[b + 2]) * w;

    const i = cEdge[e * 2] * 3, j = cEdge[e * 2 + 1] * 3;
    const dx = cx[j] - cx[i], dy = cx[j + 1] - cx[i + 1], dz = cx[j + 2] - cx[i + 2];

    cx[i] += dx * c; cx[i + 1] += dy * c; cx[i + 2] += dz * c;

  let mx = 0, my = 0, mz = 0;
  for (let i = 0; i < NC; i++) { mx += cx[i * 3]; my += cx[i * 3 + 1]; mz += cx[i * 3 + 2]; }
  mx /= NC; my /= NC; mz /= NC;
  _A.fill(0);
  for (let i = 0; i < NC; i++) {
    const b = i * 3;
    const dx = cx[b] - mx, dy = cx[b + 1] - my, dz = cx[b + 2] - mz;
    const qx = cq[b], qy = cq[b + 1], qz = cq[b + 2];
    _A[0] += dx * qx; _A[1] += dx * qy; _A[2] += dx * qz;
    _A[3] += dy * qx; _A[4] += dy * qy; _A[5] += dy * qz;
    _A[6] += dz * qx; _A[7] += dz * qy; _A[8] += dz * qz;

  _q.copy(sim.q).slerp(IDQ, 0.012);
  quatToMat(_q, _G);

  const sx = 1 - 0.06 * p, sy = 1 / (sx * sx);
  sim.S[0] = sx; sim.S[1] = sy; sim.S[2] = sx;
  const pk = sim.poke;
  let pkAmt = 0;
  if (pk) {
    const a = sim.t - pk.t0;
    pkAmt = a < 0.035 ? a / 0.035 : a < pk.hold ? 1 : 0;

  // a poke dents the surface without shoving the body: offset all goals by the dent's mean
  let cmx = 0, cmy = 0, cmz = 0;
  if (pkAmt > 0) { const f = pk.depth * pkAmt * pk.wSum / NC; cmx = pk.n.x * f; cmy = pk.n.y * f; cmz = pk.n.z * f; }
  for (let i = 0; i < NC; i++) {
    const b = i * 3;
    const qx = cq[b] * sx, qy = cq[b + 1] * sy, qz = cq[b + 2] * sx;
    let gx = mx + _G[0] * qx + _G[1] * qy + _G[2] * qz;

  for (let i = 0; i < NC; i++) { mx += cx[i * 3]; my += cx[i * 3 + 1]; mz += cx[i * 3 + 2]; }

// segment-segment closest points (Ericson); returns [s,t]
const _st = [0, 0];
function segSeg(p1x, p1y, p1z, q1x, q1y, q1z, p2x, p2y, p2z, q2x, q2y, q2z) {
  const d1x = q1x - p1x, d1y = q1y - p1y, d1z = q1z - p1z;
  const d2x = q2x - p2x, d2y = q2y - p2y, d2z = q2z - p2z;
  const rx = p1x - p2x, ry = p1y - p2y, rz = p1z - p2z;
  const a = d1x * d1x + d1y * d1y + d1z * d1z, e = d2x * d2x + d2y * d2y + d2z * d2z;
  const f = d2x * rx + d2y * ry + d2z * rz, c = d1x * rx + d1y * ry + d1z * rz;

  let s = den > 1e-14 ? Math.min(1, Math.max(0, (b * f - c * e) / den)) : 0;
  let t = (b * s + f) / e;

  else if (t > 1) { t = 1; s = Math.min(1, Math.max(0, (b - c) / a)); }

}

function invMass(k, i) { return (i === 0 || T[k].grabbed === i) ? 0 : 1; }

function collideTentacles() {
  let worst = 0;
  const NSg = TN * TSEG;
  for (let A = 0; A < NSg; A++) {
    const ka = (A / TSEG) | 0, ia = A % TSEG;
    const a0 = (ka * TP + ia) * 3, a1 = a0 + 3;
    const amx = (tx[a0] + tx[a1]) * 0.5, amy = (tx[a0 + 1] + tx[a1 + 1]) * 0.5, amz = (tx[a0 + 2] + tx[a1 + 2]) * 0.5;
    const ra = Math.max(tRad[ka * TP + ia], tRad[ka * TP + ia + 1]);
    for (let B = A + 1; B < NSg; B++) {
      const kb = (B / TSEG) | 0, ib = B % TSEG;
      if (ka === kb && ib - ia < 4) continue;
      if (ia === 0 && ib === 0) continue;
      const b0 = (kb * TP + ib) * 3, b1 = b0 + 3;
      const bmx = (tx[b0] + tx[b1]) * 0.5 - amx, bmy = (tx[b0 + 1] + tx[b1 + 1]) * 0.5 - amy, bmz = (tx[b0 + 2] + tx[b1 + 2]) * 0.5 - amz;
      const rb = Math.max(tRad[kb * TP + ib], tRad[kb * TP + ib + 1]);
      const reach = ra + rb + 0.03;
      if (bmx * bmx + bmy * bmy + bmz * bmz > reach * reach) continue;
      segSeg(tx[a0], tx[a0 + 1], tx[a0 + 2], tx[a1], tx[a1 + 1], tx[a1 + 2], tx[b0], tx[b0 + 1], tx[b0 + 2], tx[b1], tx[b1 + 1], tx[b1 + 2]);
      const s = _st[0], t = _st[1];

      const cbx = tx[b0] + (tx[b1] - tx[b0]) * t, cby = tx[b0 + 1] + (tx[b1 + 1] - tx[b0 + 1]) * t, cbz = tx[b0 + 2] + (tx[b1 + 2] - tx[b0 + 2]) * t;
      let nx = cax - cbx, ny = cay - cby, nz = caz - cbz;
      const d = Math.sqrt(nx * nx + ny * ny + nz * nz);
      const rA = tRad[ka * TP + ia] * (1 - s) + tRad[ka * TP + ia + 1] * s;
      const rB = tRad[kb * TP + ib] * (1 - t) + tRad[kb * TP + ib + 1] * t;
      const minD = rA + rB + 0.0015;
      if (d >= minD) continue;
      if (d < 1e-9) { nx = 0; ny = 1; nz = 0; } else { nx /= d; ny /= d; nz /= d; }
      const pen = minD - d;
      worst = Math.max(worst, pen - 0.0015);

      const wb0 = invMass(kb, ib) * (1 - t), wb1 = invMass(kb, ib + 1) * t;

      if (W < 1e-9) continue;
      const l = pen / W;
      tx[a0] += nx * l * wa0; tx[a0 + 1] += ny * l * wa0; tx[a0 + 2] += nz * l * wa0;
      tx[a1] += nx * l * wa1; tx[a1 + 1] += ny * l * wa1; tx[a1 + 2] += nz * l * wa1;
      tx[b0] -= nx * l * wb0; tx[b0 + 1] -= ny * l * wb0; tx[b0 + 2] -= nz * l * wb0;
      tx[b1] -= nx * l * wb1; tx[b1 + 1] -= ny * l * wb1; tx[b1 + 2] -= nz * l * wb1;
    }
  }

}

// collide a point against the mantle & crown ellipsoids (in the cage frame); returns penetration before push
function collideBody(b, r, i) {
  const R = sim.R, S = sim.S, m = sim.m;
  let worst = 0;
  const dx = tx[b] - m.x, dy = tx[b + 1] - m.y, dz = tx[b + 2] - m.z;
  // to local
  let lx = R[0] * dx + R[3] * dy + R[6] * dz;
  let ly = R[1] * dx + R[4] * dy + R[7] * dz;
  let lz = R[2] * dx + R[5] * dy + R[8] * dz;
  let hit = false;
  const ell = (cy, ax, ay, az) => {
    const ex = ax + r, ey = ay + r, ez = az + r;
    const yy = ly - cy;
    const e = (lx / ex) ** 2 + (yy / ey) ** 2 + (lz / ez) ** 2;
    if (e < 1 && e > 1e-9) {
      const f = 1 / Math.sqrt(e);
      worst = Math.max(worst, (f - 1) * Math.sqrt(lx * lx + yy * yy + lz * lz) / f);
      lx *= f; ly = cy + yy * f; lz *= f; hit = true;
    }
  };
  if (i >= 2) ell(0, SEMI[0] * S[0], SEMI[1] * S[1], SEMI[2] * S[2]);
  if (i >= 5) ell(-0.082, 0.078, 0.04, 0.078);
  if (hit) {
    tx[b] = m.x + R[0] * lx + R[1] * ly + R[2] * lz;
    tx[b + 1] = m.y + R[3] * lx + R[4] * ly + R[5] * lz;
    tx[b + 2] = m.z + R[6] * lx + R[7] * ly + R[8] * lz;
  }
  const floor = SEABED + r + 0.004;
  if (tx[b + 1] < floor) { worst = Math.max(worst, floor - tx[b + 1] - 0.004); tx[b + 1] = floor; }
  return worst;
}

function clampStretch(k, g) {
  // hard limit: no segment up to the grab point may exceed 1.48x rest length
  const rb = k * TP * 3, Lmax = L0 * 1.48;
  for (let rep = 0; rep < 8; rep++) {
    for (let n = 0; n < 2 * g; n++) {
      const i = n < g ? n : 2 * g - 1 - n;
      const p0 = rb + i * 3, p1 = p0 + 3;
      const ex = tx[p1] - tx[p0], ey = tx[p1 + 1] - tx[p0 + 1], ez = tx[p1 + 2] - tx[p0 + 2];
      const len = Math.sqrt(ex * ex + ey * ey + ez * ez);
      if (len <= Lmax) continue;
      const f = (len - Lmax) / len;
      if (n < g && i + 1 !== g) { tx[p1] -= ex * f; tx[p1 + 1] -= ey * f; tx[p1 + 2] -= ez * f; }
      else if (i !== 0) { tx[p0] += ex * f; tx[p0 + 1] += ey * f; tx[p0 + 2] += ez * f; }
    }
  }
}

const _wv = [0, 0, 0];
function stepTentacles(dt) {
  const R = sim.R, S = sim.S, m = sim.m;
  const ss = stiffScale();
  const bendScale = Math.min(1.5, Math.max(0.45, Math.sqrt(ss)));
  const fd = 1 - Math.exp(-2.0 * dt);              // water drag 2.0

    const tt = T[k];

    const g = tt.grabbed;
    const rb = k * TP * 3;
    // root (kinematic, in cage frame)
    const lx = tt.rootL[0] * S[0], ly = tt.rootL[1] * S[1], lz = tt.rootL[2] * S[2];
    const rx = m.x + R[0] * lx + R[1] * ly + R[2] * lz;
    const ry = m.y + R[3] * lx + R[4] * ly + R[5] * lz;
    const rz = m.z + R[6] * lx + R[7] * ly + R[8] * lz;

      const want = Math.min(1.5, Math.max(1, dist / (g * L0 * 0.97)));

      const a = i > 0 ? tSegScale[k * TSEG + i - 1] : 1, c = i < TSEG ? tSegScale[k * TSEG + i] : a;
      tRad[k * TP + i] = baseRad[i] / Math.sqrt((a + c) * 0.5);

    let mvx = 0, mvy = 0, mvz = 0;
    for (let i = 1; i < TP; i++) { const b = rb + i * 3; mvx += tvel[b]; mvy += tvel[b + 1]; mvz += tvel[b + 2]; }
    mvx /= TSEG; mvy /= TSEG; mvz /= TSEG;

    for (let i = 0; i < TP; i++) {
      const b = rb + i * 3;

      if (i === 0) continue;

          tx[bn + 1] += (tx[b + 1] + tdy * L - tx[bn + 1]) * kk;

    if (!push.x && !push.y && !ox && !oy) return;
    const ppm = pxPerMeterAt(sim.m);
    camera.matrixWorld.extractBasis(_fr, _fu, _fd);
    // pushing past the edge pans the view that way (faster the further you push), so the
    // carried hero keeps travelling; it stops where the open sand ends
    _fd.set(0, 0, 0).addScaledVector(_fr, push.x / ppm).addScaledVector(_fu, -push.y / ppm);
    const len = _fd.length();
    if (len > 1e-6) _fd.multiplyScalar(Math.min(0.45, len * 2.0) * dt / len);
    _fd.addScaledVector(_fr, ox / ppm * (1 - Math.exp(-10 * dt))).addScaledVector(_fu, -oy / ppm * (1 - Math.exp(-10 * dt)));
    // no panning past the play area: drop the outward part when the hero is already at its edge
    const r = Math.hypot(sim.m.x, sim.m.z);
    if (r > PLAY.r - 0.03) { const ox = sim.m.x / r, oz = sim.m.z / r, d = _fd.x * ox + _fd.z * oz; if (d > 0) { _fd.x -= ox * d; _fd.z -= oz * d; } }
    if ((sim.m.y > PLAY.yMax - 0.03 && _fd.y > 0) || (sim.m.y < PLAY.yMin + 0.03 && _fd.y < 0)) _fd.y = 0;
    CAM_TARGET.add(_fd); orbitCam.position.add(_fd);
    controls.update(); syncCamera();
    carryTarget();
    return;
  }
  _fd.set(HOME.x - HOME_DEFAULT.x, HOME.y - HOME_DEFAULT.y, HOME.z - HOME_DEFAULT.z).sub(CAM_TARGET);
  if (_fd.lengthSq() < 1e-10) return;
  _fd.multiplyScalar(1 - Math.exp(-2.2 * dt));
  CAM_TARGET.add(_fd); orbitCam.position.add(_fd);
}
// ================================================================= LOOP
const stats = { fps: 0, frames: [], windowFps: [], halved: false, frameMs: 0 };
let acc = 0, last = performance.now(), fpsWinStart = last, fpsWinCount = 0, lowWins = 0, started = last;
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t0 = performance.now();
  if (!window.__jellyPaused) {
    acc += dt;
    let n = 0;
    while (acc >= SUB && n < 8) { physicsStep(SUB); acc -= SUB; n++; }
    if (n === 8) acc = 0;
    stepWorld(dt);
    followCamera(dt);
  }
  if (window.__jellyNoRender) return;
  updateHero(dt);
  controls.update();
  syncCamera();
  drawWorld();
  heroCenter(_hp);
  {
    const fHero = camera.position.distanceTo(_hp);
    const up = THREE.MathUtils.clamp((_sph.phi - POLAR_FLOOR) / LOOK_UP_RANGE, 0, 1);
    const fSurf = (SURF_Y - camera.position.y) / Math.max(0.2, camera.getWorldDirection(_a).y);
    bokehPass.uniforms.focus.value = THREE.MathUtils.lerp(fHero, fSurf, THREE.MathUtils.smoothstep(up, 0, 0.6));
  }
  if (window.__jellyMask) renderHeroMask(); else composer.render(dt);
  stats.frameMs = performance.now() - t0;
  stats.frameNo = (stats.frameNo || 0) + 1;
  // fps monitor: if a 1 s window drops under 55 fps, halve the transmission resolution
  fpsWinCount++;
  if (now - fpsWinStart >= 1000) {
    stats.fps = fpsWinCount * 1000 / (now - fpsWinStart);
    stats.windowFps.push(stats.fps); if (stats.windowFps.length > 30) stats.windowFps.shift();
    fpsWinStart = now; fpsWinCount = 0;
    if (now - started > 2000) autoQuality(stats.fps, now);
    if (now - started > 2000 && stats.fps < 55) { if (++lowWins >= 2 && !transmissionHalf) { transmissionHalf = true; stats.halved = true; } }
    else lowWins = 0;
  }
}

resetSim();
fitCamera(true);
applyQuality('high');
updateHero(0);
renderer.setAnimationLoop(tick);

// ---------------------------------------------------------------- test / inspection hooks
window.__jelly = {
  sim, T, stats, V0, NC, camera, controls,
  get transmissionHalf() { return transmissionHalf; },
  screenOfParticle(k, i) { const b = (k * TP + i) * 3; const o = {}; toScreen(tx[b], tx[b + 1], tx[b + 2], o); return o; },
  screenOfMantle() { const o = {}; toScreen(sim.m.x, sim.m.y + 0.04, sim.m.z, o); return o; },
  screenOfWorld(x, y, z) { const o = {}; toScreen(x, y, z, o); return o; },
  heroScreenBox() {
    const o = {}; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const add = (x, y, z) => { toScreen(x, y, z, o); x0 = Math.min(x0, o.x); x1 = Math.max(x1, o.x); y0 = Math.min(y0, o.y); y1 = Math.max(y1, o.y); };
    for (let v = 0; v < mantlePos.length; v += 30) add(mantlePos[v], mantlePos[v + 1], mantlePos[v + 2]);
    for (let k = 0; k < TN; k++) for (let i = 0; i < TP; i++) { const b = (k * TP + i) * 3; add(tx[b], tx[b + 1], tx[b + 2]); }
    return { x0, y0, x1, y1 };
  },
  heroWorldBox() {
    let y0 = 1e9, y1 = -1e9;
    for (let v = 1; v < mantlePos.length; v += 3) { y0 = Math.min(y0, mantlePos[v]); y1 = Math.max(y1, mantlePos[v]); }
    for (let k = 0; k < TN; k++) for (let i = 0; i < TP; i++) { const y = tx[(k * TP + i) * 3 + 1]; y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    return { y0, y1, h: y1 - y0 };
  },
  volume() { return triVolume(cx, sim.m.x, sim.m.y, sim.m.z) / V0; },
  comSpeed: comVelocity,
  dentDepth() {
    // how far the poked spot sits inside the undisturbed (goal) surface
    const pk = sim.poke; if (!pk) return 0;
    let best = 0;
    for (let i = 0; i < NS; i++) if (pk.w[i] > 0.6) {
      const b = i * 3, qx = cq[b] * sim.S[0], qy = cq[b + 1] * sim.S[1], qz = cq[b + 2] * sim.S[2], G = sim.R;
      const gx = sim.m.x + G[0] * qx + G[1] * qy + G[2] * qz, gy = sim.m.y + G[3] * qx + G[4] * qy + G[5] * qz, gz = sim.m.z + G[6] * qx + G[7] * qy + G[8] * qz;
      best = Math.max(best, -((cx[b] - gx) * pk.n.x + (cx[b + 1] - gy) * pk.n.y + (cx[b + 2] - gz) * pk.n.z));
    }
    return best;
  },
  // motion energy relative to the undisturbed idle goal (for the rest test)
  motion() {
    let cv = 0;
    let vx = 0, vy = 0, vz = 0;
    for (let i = 0; i < NC; i++) { vx += cvel[i * 3]; vy += cvel[i * 3 + 1]; vz += cvel[i * 3 + 2]; }
    vx /= NC; vy /= NC; vz /= NC;
    for (let i = 0; i < NC; i++) cv = Math.max(cv, Math.hypot(cvel[i * 3] - vx, cvel[i * 3 + 1] - vy, cvel[i * 3 + 2] - vz));
    let tv = 0;
    for (let i = 0; i < TN * TP; i++) tv = Math.max(tv, Math.hypot(tvel[i * 3], tvel[i * 3 + 1], tvel[i * 3 + 2]));
    return { cage: cv, tent: tv, com: Math.hypot(vx, vy, vz) };
  },
  perturb(s) {
    for (let i = 0; i < NC * 3; i++) cvel[i] += (Math.random() - 0.5) * 2 * s;
    for (let i = 3; i < TN * TP * 3; i++) tvel[i] += (Math.random() - 0.5) * 2 * s;
  },
  step(seconds) {
    const n = Math.round(seconds / SUB);
    for (let i = 0; i < n; i++) { physicsStep(SUB); if (i % 4 === 3 || i === n - 1) stepWorld(SUB * (i % 4 === 3 ? 4 : (i % 4) + 1)); }
    followCamera(seconds); controls.update(); syncCamera();
    updateHero(SUB);
  },
  HOME, CAM_TARGET, pointer,
  world, school, crab, jellies, bigFish, quality, applyQuality, WU, causRT, renderer, orbitCam, scene, gtaoPass, bokehPass, shaftsPass,
  setOrbit(polarDeg, azDeg, dist) {
    _sph.set(dist, THREE.MathUtils.degToRad(polarDeg), THREE.MathUtils.degToRad(azDeg));
    orbitCam.position.setFromSpherical(_sph).add(CAM_TARGET); orbitCam.lookAt(CAM_TARGET);
    controls.update(); syncCamera();
  },
  heroCenter() { return heroCenter(new THREE.Vector3()); },
  groundY, foot, SEABED, SURF_Y, onHeroJet,
  reefInstances() {
    // every placed reef/plant instance: base position vs the sand under it
    const out = [];
    for (const [k, im] of Object.entries(world.objs)) {
      if (!im.isInstancedMesh) continue;
      const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
      const n = k === 'grass' ? im.count : im.count;
      for (let i = 0; i < n; i++) { im.getMatrixAt(i, m); m.decompose(p, q, sc); if (p.y < -10) continue; out.push({ k, x: p.x, y: p.y, z: p.z, s: sc.x, g: groundY(p.x, p.z), r: Math.hypot(p.x, p.z) }); }
    }
    return out;
  },
  penetration() {
    // worst current overlap (m): tentacle/tentacle capsules and tentacle/mantle
    let worst = 0;
    const NSg = TN * TSEG;
    for (let A = 0; A < NSg; A++) for (let B = A + 1; B < NSg; B++) {
      const ka = (A / TSEG) | 0, ia = A % TSEG, kb = (B / TSEG) | 0, ib = B % TSEG;
      if (ka === kb && ib - ia < 4) continue; if (ia === 0 && ib === 0) continue;
      const a0 = (ka * TP + ia) * 3, a1 = a0 + 3, b0 = (kb * TP + ib) * 3, b1 = b0 + 3;
      segSeg(tx[a0], tx[a0 + 1], tx[a0 + 2], tx[a1], tx[a1 + 1], tx[a1 + 2], tx[b0], tx[b0 + 1], tx[b0 + 2], tx[b1], tx[b1 + 1], tx[b1 + 2]);
      const s = _st[0], t = _st[1];
      const d = Math.hypot(tx[a0] + (tx[a1] - tx[a0]) * s - tx[b0] - (tx[b1] - tx[b0]) * t, tx[a0 + 1] + (tx[a1 + 1] - tx[a0 + 1]) * s - tx[b0 + 1] - (tx[b1 + 1] - tx[b0 + 1]) * t, tx[a0 + 2] + (tx[a1 + 2] - tx[a0 + 2]) * s - tx[b0 + 2] - (tx[b1 + 2] - tx[b0 + 2]) * t);
      const rA = tRad[ka * TP + ia] * (1 - s) + tRad[ka * TP + ia + 1] * s, rB = tRad[kb * TP + ib] * (1 - t) + tRad[kb * TP + ib + 1] * t;
      worst = Math.max(worst, rA + rB - d);
    }
    const R = sim.R, S = sim.S, m = sim.m;
    let body = 0;
    for (let k = 0; k < TN; k++) for (let i = 2; i < TP; i++) {
      const b = (k * TP + i) * 3, r = tRad[k * TP + i];
      const dx = tx[b] - m.x, dy = tx[b + 1] - m.y, dz = tx[b + 2] - m.z;
      const lx = R[0] * dx + R[3] * dy + R[6] * dz, ly = R[1] * dx + R[4] * dy + R[7] * dz, lz = R[2] * dx + R[5] * dy + R[8] * dz;
      const e = Math.sqrt((lx / (SEMI[0] * S[0] + r)) ** 2 + (ly / (SEMI[1] * S[1] + r)) ** 2 + (lz / (SEMI[2] * S[2] + r)) ** 2);
      if (e < 1) body = Math.max(body, (1 - e) * Math.hypot(lx, ly, lz) / Math.max(e, 1e-6) * e);
    }
    return { tentacle: worst, body };
  },
  maxStretchNow() { let best = 1; for (let k = 0; k < TN; k++) best = Math.max(best, T[k].stretch); return best; },
  curls() { return T.map((t) => +t.curl.toFixed(3)); },
  counts: { cage: NC, mantleVerts: mantleSkin.n, mantleTris: nets.index.length / 3, suckers: TN * SUCK_PER, segments: TSEG },
};
